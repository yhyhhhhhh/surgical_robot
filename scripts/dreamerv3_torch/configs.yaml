defaults:

  model_only: False
  model_path: False # "latent_safety/log/dreamerv3/1225/latest.pt"
  use_ensemble: False  # True
  use_unit_ensemble: False 
  use_nf: False
  remark: 'test'
  logdir: 'latent_safety/log/dreamerv3/world_model_only'
  traindir: null
  evaldir: null
  # offline_traindir: ['/home/yhy/IsaacLabExtensionTemplate/expert_data_episodes'] #['/home/yhy/IsaacLabExtensionTemplate/latent_safety/log/dreamerv3/collect_data/']
  offline_traindir: null
  offline_evaldir: '/home/yhy/IsaacLabExtensionTemplate/expert_data_episodes'
  seed: 422
  deterministic_run: False
  steps: 5e6
  parallel: False
  eval_every: 12800
  eval_episode_num: 1 # 10
  log_every: 1e4
  save_every: 1e6
  reset_every: 0
  device: 'cuda'
  compile: True
  precision: 32
  debug: False
  video_pred_log: False # True

  # Environment
  task: 'My-Isaac-Ur3-PipeRelCam-Ik-RL-Direct-v0'
  size: [128, 128]
  envs: 4
  action_repeat: 1
  time_limit: 1000
  grayscale: False
  prefill: 20000 #2500
  reward_EMA: True

  # Model
  dyn_hidden: 256
  dyn_deter: 256
  units: 256
  dyn_stoch: 32
  dyn_discrete: 32 # set as 0 for continuous latent  #32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'cont'] # ['decoder', 'reward', 'cont'] # 
  # grad_heads: ['decoder', 'action'] # ['decoder', 'reward', 'cont'] #
  act: 'SiLU'
  norm: True
  # encoder:
  #   {mlp_keys: 'policy', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  # decoder:
  #   {mlp_keys: 'policy', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}

  encoder:
    {mlp_keys: 'policy', cnn_keys: '$^', act: 'SiLU', norm: True,
    cnn_depth: 32, kernel_size: 4, minres: 4,
    mlp_layers: 3, mlp_units: 512, symlog_inputs: True}

  decoder:
    {mlp_keys: 'policy', cnn_keys: '$^', act: 'SiLU', norm: True,
    cnn_depth: 32, kernel_size: 4, minres: 4,
    mlp_layers: 3, mlp_units: 512,
    cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 1e-2, unimix_ratio: 0.01, std: 'learned', min_std: 0.3, max_std: 2.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  # action_head:
  #   {layers: 2, dist: 'normal_std_fixed', loss_scale: 1.0, outscale: 0.0}
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}

  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'zeros'

  # Training
  batch_size: 16
  batch_length: 64
  train_ratio: 32
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 5e6
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 30
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'random'
  expl_until: 4
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'deter'
  disag_log: True
  disag_models: 5 #10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: True

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 4
  batch_length: 16
